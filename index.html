<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Konvert Budget</title>
<meta name="theme-color" content="#F1F3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Konvert">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>@font-face{font-family:'Bricolage Grotesque';font-weight:500;font-style:normal;font-display:swap;src:url(bricolage-grotesque-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-weight:700;font-style:normal;font-display:swap;src:url(bricolage-grotesque-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:400;font-style:normal;font-display:swap;src:url(instrument-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:500;font-style:normal;font-display:swap;src:url(instrument-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:600;font-style:normal;font-display:swap;src:url(instrument-sans-latin-600-normal.woff2) format('woff2')}
[hidden]{display:none!important}

/* Layout: one-column phone app. Balance on top, accounts ("envelopes") below, bottom tab bar with a centre + button. */
:root{
  color-scheme:light;
  --bg:#F1F3F4; --card:#FFFFFF; --card2:#E7EBED; --line:#DCE1E4;
  --ink:#121C1E; --mute:#667579; --accent:#2B45D4; --on-accent:#FFFFFF;
  --inc:#12805A; --exp:#C9432E; --amber:#C98A14; --shadow:0 1px 2px rgba(18,28,30,.06);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1113; --card:#161B1E; --card2:#20272B; --line:#2A3236;
  --ink:#ECF1F2; --mute:#8D9CA1; --accent:#8195FF; --on-accent:#0D1113;
  --inc:#4CC58F; --exp:#FF8D76; --amber:#F0B440; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1113; --card:#161B1E; --card2:#20272B; --line:#2A3236;
  --ink:#ECF1F2; --mute:#8D9CA1; --accent:#8195FF; --on-accent:#0D1113;
  --inc:#4CC58F; --exp:#FF8D76; --amber:#F0B440; --shadow:none; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px}

html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;
  max-width:520px;margin-inline:auto;padding-inline:16px;padding-block:14px 110px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mute);min-width:0}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.btn{background:var(--accent);color:var(--on-accent);border-radius:14px;padding:14px;font-weight:600;width:100%;text-align:center}
.btn[disabled]{opacity:.35}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--exp);border:1px solid var(--exp)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px;flex:none}
input.field,select.field{width:100%;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:11px 12px;min-width:0}
input.field:focus{border-color:var(--accent);outline:0}

/* home */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:20px}
.gear{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.gear svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
.hero{padding:6px 2px 4px}
.big{font-family:var(--f-display);font-weight:700;font-size:44px;letter-spacing:-.02em;line-height:1.05;word-break:break-word}
.big small{font-size:18px;color:var(--mute);font-weight:500;letter-spacing:0;margin-left:4px}
.pot{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.pot .nm{font-weight:600}
.pot .bal{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em}
.pot .bal small{font-size:13px;color:var(--mute);font-weight:500;margin-left:3px}
.neg{color:var(--exp)}
.banner{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.link{display:block;width:100%;text-align:left}

/* list */
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .t{min-width:0;flex:1}
.tx .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t span{font-size:12.5px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{text-align:right;font-weight:600;white-space:nowrap}
.tx .a span{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.inc{color:var(--inc)} .tr{color:var(--mute)}
.day{display:flex;justify-content:space-between;margin:16px 2px 4px}

/* period */
.period{display:flex;align-items:center;gap:6px;margin:12px 0}
.period .nav{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.period .pl{flex:1;text-align:center;font-weight:600}

/* stats */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .v{font-family:var(--f-display);font-weight:700;font-size:22px;word-break:break-word}
.donutwrap{position:relative;width:200px;max-width:100%;margin:6px auto}
.donutwrap svg{display:block;width:100%;height:auto}
.donutc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px;pointer-events:none}
.donutc b{font-family:var(--f-display);font-size:20px;line-height:1.1;word-break:break-word}
.legend button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border-top:1px solid var(--line);text-align:left}
.legend button:first-child{border-top:0}
.legend .pc{width:42px;text-align:right;color:var(--mute);font-size:13px}
.bar{fill:var(--accent)} .gl{stroke:var(--line);stroke-width:1} .axt{fill:var(--mute);font-size:9px;font-family:var(--f-body)}
.track{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;border-radius:4px}
.lim{padding:8px 0}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs .in{max-width:520px;margin:auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center}
.tabs button.t{padding:8px 0;font-size:11.5px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.t.on{color:var(--accent)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.plus{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);margin:-22px auto 0;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.plus svg{width:26px;height:26px;stroke-width:2.4}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--bg);border-radius:22px 22px 0 0;max-height:94%;display:flex;flex-direction:column;max-width:520px;margin:auto}
.sheet .body{overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:14px}
.sheet .foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;background:var(--bg)}
.grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:8px auto 0}
.amt{display:flex;align-items:baseline;gap:10px;justify-content:center;padding:4px 0}
.amt b{font-family:var(--f-display);font-size:46px;letter-spacing:-.02em;line-height:1.1}
.amt button{background:var(--card2);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:500}
.pad button:active{background:var(--card2)}
.warn{font-size:12.5px;color:var(--exp)}
.note{font-size:12.5px;color:var(--mute)}
.pchip{flex-direction:column;align-items:flex-start;gap:0;border-radius:14px;padding:8px 12px}
.pchip small{font-size:12px;opacity:.7;font-weight:400}
.split{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;z-index:20;max-width:88%;text-align:center}
textarea.field{width:100%;min-height:90px;background:var(--card2);border:0;border-radius:12px;padding:10px;font:16px/1.3 ui-monospace,monospace;color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:24px 0}
.dl{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetroot"></div>
<div id="toast" class="toast" hidden></div>
<nav class="tabs" id="tabs"></nav>

<script>
(function(){
'use strict';
var KEY='konvert.v1', CURS=['AED','KGS','USD'];
var MS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var DN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
var COLORS=['#E4572E','#E9A23B','#3FA796','#4C6FFF','#9B5DE5','#E26CA5','#6C8E3F','#2D9CDB','#8A8F98'];
var storageOK=true;

function uid(){return Math.random().toString(36).slice(2,9)}
function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function pd(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function r2(n){return Math.round(n*100)/100}
function nf(n){n=r2(n);if(Object.is(n,-0))n=0;return n.toLocaleString('ru-RU',{maximumFractionDigits:2})}
function fd(s){var d=pd(s);return d.getDate()+' '+MS[d.getMonth()]}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0}

/* ---------- state ---------- */
function seed(){
  var t=new Date();
  function off(n){return ymd(addDays(t,-n))}
  var pots=[{id:'p1',name:'Коммуналка',cur:'AED'},{id:'p2',name:'Личные',cur:'AED'}];
  var cats=[
    {id:'c1',name:'Еда',type:'e',color:COLORS[0]},{id:'c2',name:'Транспорт',type:'e',color:COLORS[1]},
    {id:'c3',name:'Коммуналка',type:'e',color:COLORS[2]},{id:'c4',name:'Аренда',type:'e',color:COLORS[3]},
    {id:'c5',name:'Покупки',type:'e',color:COLORS[4]},{id:'c6',name:'Здоровье',type:'e',color:COLORS[5]},
    {id:'c7',name:'Развлечения',type:'e',color:COLORS[6]},{id:'c8',name:'Учёба',type:'e',color:COLORS[7]},
    {id:'c9',name:'Другое',type:'e',color:COLORS[8]},
    {id:'c10',name:'Подписки',type:'e',color:'#B5651D'},
    {id:'i1',name:'Зарплата',type:'i',color:'#12805A'},{id:'i2',name:'Пополнение',type:'i',color:'#2D9CDB'},
    {id:'i3',name:'Подарок',type:'i',color:'#E26CA5'},{id:'i4',name:'Другой доход',type:'i',color:'#8A8F98'},
    {id:'i5',name:'Начальный остаток',type:'i',color:'#8A8F98',noStats:true}];
  function X(tt,amt,cur,cat,pot,d,note){return{id:uid(),t:tt,amt:amt,cur:cur,cat:cat,pot:pot,to:null,date:off(d),note:note||'',ts:Date.now()-d*1000}}
  var dinner=X('e',120,'AED','c1','p2',4,'Ужин с Али');dinner.owed=60;
  var tx=[
    X('i',2000,'AED','i2','p1',16,'Бюджет на коммуналку на месяц'),
    X('i',3000,'AED','i2','p2',16,'Личный бюджет на месяц'),
    X('e',410,'AED','c3','p1',9,'Электричество и вода'),
    X('e',349,'AED','c3','p1',6,'Интернет'),
    X('e',86.5,'AED','c1','p2',1,'Продукты'),
    X('e',18,'AED','c1','p2',0,'Кофе'),
    X('e',32,'AED','c2','p2',2,'Такси'),
    X('e',45,'AED','c1','p2',3,'Обед'),
    X('e',1200,'KGS','c5','p2',12,'Рынок в Бишкеке'),
    X('e',120,'AED','c7','p2',5,'Кино'),
    X('e',64,'AED','c2','p2',8,'Карта метро'),dinner];
  var nx=new Date(t.getFullYear(),t.getMonth()+1,1,12);
  return{v:2,sample:true,disp:'AED',rates:{AED:3.6725,KGS:87.5},ratesAt:0,pots:pots,cats:cats,tx:tx,last:{pot:'p2'},
    debts:[{id:'d1',who:'Али',dir:'to',cur:'AED',amt:60,date:off(4),note:'Ужин с Али',txId:dinner.id,pays:[]}],
    rec:[{id:'r1',name:'Интернет',t:'e',amt:349,cur:'AED',cat:'c3',pot:'p1',freq:'monthly',dom:1,next:ymd(nx),on:true}],
    limits:{c1:{amt:800,cur:'AED'},c7:{amt:300,cur:'AED'}}};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.pots&&o.tx)return o}}catch(e){storageOK=false}
  return seed();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
var S=load();
function fix(){S.debts=S.debts||[];S.rec=S.rec||[];S.limits=S.limits||{};S.last=S.last||{};S.debts.forEach(function(d){d.pays=d.pays||[]})}
fix();

/* ---------- automatic backups (kept on this device, newest first) ---------- */
var BK='konvert.bk';
function bkList(){try{return JSON.parse(localStorage.getItem(BK)||'[]')}catch(e){return[]}}
function snapshot(reason){
  var l=bkList(),data=JSON.stringify(S);
  if(reason==='auto'&&l.length&&l[0].data===data)return;
  l.unshift({ts:Date.now(),reason:reason,data:data});
  l=l.slice(0,12);
  try{localStorage.setItem(BK,JSON.stringify(l))}catch(e){
    try{localStorage.setItem(BK,JSON.stringify(l.slice(0,3)))}catch(e2){}
  }
}
function autoSnap(){
  if(S.sample)return;
  var l=bkList();
  if(!l.length||Date.now()-l[0].ts>20*36e5)snapshot('auto');
}
function fdt(ts){var d=new Date(ts),h=d.getHours(),m=d.getMinutes();return d.getDate()+' '+MS[d.getMonth()]+', '+(h<10?'0':'')+h+':'+(m<10?'0':'')+m}
var REASON={auto:'Автоматически',manual:'Вручную','before erase':'Перед стиранием','before restore':'Перед восстановлением'};
autoSnap();

var ui={tab:'home',per:'month',anchor:new Date(),fCat:'',fPot:'',q:'',sheet:null,draft:null,confirm:'',restore:''};
ui.anchor.setHours(12);

/* ---------- money ---------- */
function rate(c){return c==='USD'?1:(S.rates[c]||1)}
function conv(a,f,t){return f===t?a:a/rate(f)*rate(t)}
function pot(id){return S.pots.filter(function(p){return p.id===id})[0]}
function cat(id){return S.cats.filter(function(c){return c.id===id})[0]||{name:'Другое',color:'#8A8F98',type:'e'}}
function share(t){return t.t==='e'?t.amt-(t.owed||0):t.amt}
function toDisp(t){return conv(share(t),t.cur,S.disp)}
function fullDisp(t){return conv(t.amt,t.cur,S.disp)}
function potBal(p){
  var b=0;
  S.tx.forEach(function(t){
    if(t.pot===p.id){var v=conv(t.amt,t.cur,p.cur);b+=(t.t==='i')?v:-v}
    if(t.t==='tr'&&t.to===p.id)b+=conv(t.amt,t.cur,p.cur);
  });
  return b;
}
function rem(db){var s=0;db.pays.forEach(function(p){s+=p.amt});return r2(db.amt-s)}
function openDebts(){return S.debts.filter(function(d){return rem(d)>0.004})}
function debtSums(){
  var to=0,from=0;
  openDebts().forEach(function(d){var v=conv(rem(d),d.cur,S.disp);if(d.dir==='to')to+=v;else from+=v});
  return{to:to,from:from};
}
function people(){
  var seen={},out=[];
  S.debts.forEach(function(d){var k=d.who.toLowerCase();if(!seen[k]){seen[k]=1;out.push(d.who)}});
  return out;
}

/* ---------- periods ---------- */
function rangeD(per,anchor){
  var a=new Date(anchor),s,e;
  if(per==='day'){s=a;e=a}
  else if(per==='week'){var dd=(a.getDay()+6)%7;s=addDays(a,-dd);e=addDays(s,6)}
  else if(per==='month'){s=new Date(a.getFullYear(),a.getMonth(),1,12);e=new Date(a.getFullYear(),a.getMonth()+1,0,12)}
  else{s=new Date(a.getFullYear(),0,1,12);e=new Date(a.getFullYear(),11,31,12)}
  return[s,e];
}
function plabel(){
  var a=ui.anchor,r=rangeD(ui.per,a),s=r[0],e=r[1];
  if(ui.per==='day')return DN[a.getDay()]+', '+a.getDate()+' '+MS[a.getMonth()]+' '+a.getFullYear();
  if(ui.per==='week')return s.getDate()+' '+MS[s.getMonth()]+' – '+e.getDate()+' '+MS[e.getMonth()];
  if(ui.per==='month')return MN[a.getMonth()]+' '+a.getFullYear();
  return String(a.getFullYear());
}
function shift(n){
  var a=ui.anchor;
  if(ui.per==='day')ui.anchor=addDays(a,n);
  else if(ui.per==='week')ui.anchor=addDays(a,7*n);
  else if(ui.per==='month')ui.anchor=new Date(a.getFullYear(),a.getMonth()+n,1,12);
  else ui.anchor=new Date(a.getFullYear()+n,0,1,12);

function limitInfo(catId,date){
  var L=S.limits[catId];if(!L||!(L.amt>0))return null;
  var sp=0;
  inRange('month',date).forEach(function(t){if(t.t==='e'&&t.cat===catId&&!t.dflag)sp+=conv(share(t),t.cur,L.cur)});
  return{spent:sp,limit:L.amt,cur:L.cur,pct:sp/L.amt};
}
function limRow(c,i){

/* ---------- recurring ---------- */
function advance(r){
  var d=pd(r.next);
  if(r.freq==='weekly')return ymd(addDays(d,7));
  var y=d.getFullYear(),m=d.getMonth();
  if(r.freq==='monthly')m++;else y++;
  var ny=y+Math.floor(m/12),nm=m%12,dim=new Date(ny,nm+1,0).getDate();
  return ymd(new Date(ny,nm,Math.min(r.dom||d.getDate(),dim),12));
}
function processRec(){
  var td=ymd(new Date()),n=0;
  S.rec=S.rec.filter(function(r){return pot(r.pot)});
  S.rec.forEach(function(r){
    var g=0;
    while(r.on!==false&&r.next<=td&&g<400){
      S.tx.push({id:uid(),t:r.t,amt:r.amt,cur:r.cur,cat:r.cat,pot:r.pot,to:null,date:r.next,note:r.name,ts:Date.now()+n,rec:r.id});
      r.next=advance(r);g++;n++;
    }
  });
  if(n)save();
  return n;
}

function donut(items,total){
  var off=25,out='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--card2)" stroke-width="5"/>';
  items.forEach(function(it){
    var pc=it.v/total*100,len=Math.max(pc-(items.length>1?.8:0),.05);
    out+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+it.color+'" stroke-width="5" stroke-dasharray="'+len+' '+(100-len)+'" stroke-dashoffset="'+off+'"/>';
    off-=pc;
  });
  return '<svg viewBox="0 0 42 42" role="img" aria-label="Расходы по категориям">'+out+'</svg>';
}
function bars(vals,labels){
  var W=320,H=132,top=16,bot=18,n=vals.length,mx=Math.max.apply(null,vals.concat([1])),bw=W/n,ch=H-top-bot,o='';
  o+='<line class="gl" x1="0" x2="'+W+'" y1="'+top+'" y2="'+top+'"/><line class="gl" x1="0" x2="'+W+'" y1="'+(H-bot)+'" y2="'+(H-bot)+'"/>';
  o+='<text class="axt" x="0" y="'+(top-4)+'">'+nf(mx)+'</text>';
  var step=n>12?Math.ceil(n/7):1;
  vals.forEach(function(v,i){
    var h=v/mx*ch,x=i*bw+bw*.2,w=bw*.6;
    if(v>0)o+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+(H-bot-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,1.5).toFixed(1)+'" rx="2.5"/>';
    if(i%step===0)o+='<text class="axt" text-anchor="middle" x="'+(i*bw+bw/2).toFixed(1)+'" y="'+(H-5)+'">'+labels[i]+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Расходы по времени">'+o+'</svg>';
}

function catsSorted(ty){
  var cnt={};S.tx.forEach(function(t){if(t.cat)cnt[t.cat]=(cnt[t.cat]||0)+1});
  return S.cats.filter(function(c){return c.type===ty}).sort(function(a,b){return (cnt[b.id]||0)-(cnt[a.id]||0)});
}
function newDraft(t,potId){
  var p=pot(potId||(S.last&&S.last.pot))||S.pots[0];
  return{t:t||'e',amt:'',cur:p?p.cur:S.disp,cat:'',pot:p?p.id:'',to:'',date:ymd(new Date()),note:'',touchedCur:false,
    split:{on:false,mode:'eq',names:[]},sname:''};
}
function openSheet(kind,draft){ui.sheet=kind;ui.draft=draft;ui.confirm='';renderSheet()}
function closeSheet(){if(ui.tm){clearInterval(ui.tm);ui.tm=null}ui.sheet=null;ui.draft=null;ui.confirm='';renderSheet();render()}
function doWipe(){
  snapshot('before erase');
  S.pots=[];S.tx=[];S.debts=[];S.rec=[];S.limits={};S.last={};S.sample=false;
  save();closeSheet();toast('Все данные стёрты. Копия лежит в Настройках.');
}
function splitCalc(d){
  var amt=parseFloat(d.amt)||0,n=d.split.names.length;
  if(d.t!=='e'||!d.split.on||!n||!(amt>0))return null;
  var mine=d.split.mode==='all'?0:r2(amt/(n+1)),owed=r2(amt-mine);
  return{mine:mine,owed:owed,each:r2(owed/n),n:n};
}
function potChips(d,action,sel){
  return S.pots.map(function(q){return '<button class="chip pchip '+(sel===q.id?'on':'')+'" data-a="'+action+'" data-id="'+q.id+'">'+esc(q.name)+'<small class="num">'+nf(potBal(q))+' '+q.cur+'</small></button>'}).join('');
}
function dateRow(d,idAttr,bind){
  var tdy=ymd(new Date()),yst=ymd(addDays(new Date(),-1));
  return '<div class="row" style="flex-wrap:wrap"><button class="chip '+(d[bind]===tdy?'on':'')+'" data-a="setd" data-f="'+bind+'" data-v="'+tdy+'">Сегодня</button><button class="chip '+(d[bind]===yst?'on':'')+'" data-a="setd" data-f="'+bind+'" data-v="'+yst+'">Вчера</button>'+
    '<input type="date" id="'+idAttr+'" data-bind="'+bind+'" class="field" style="width:auto;flex:1;min-width:140px" value="'+d[bind]+'"></div>';
}
function curChips(d,action){return '<div class="chips">'+CURS.map(function(c){return '<button class="chip '+(d.cur===c?'on':'')+'" data-a="'+action+'" data-v="'+c+'">'+c+'</button>'}).join('')+'</div>'}

function removeLinkedDebts(txId){
  S.debts.filter(function(x){return x.txId===txId}).forEach(function(x){x.pays.forEach(function(p){S.tx=S.tx.filter(function(t){return t.id!==p.txId})})});
  S.debts=S.debts.filter(function(x){return x.txId!==txId});
}
function saveTx(){
  var d=ui.draft,amt=num(d.amt);
  if(!(amt>0)||!d.pot)return;
  var rec={id:d.id||uid(),t:d.t,amt:amt,cur:d.cur,cat:d.t==='tr'?null:d.cat,pot:d.pot,to:d.t==='tr'?d.to:null,date:d.date,note:(d.note||'').trim(),ts:d.ts||Date.now()};
  var linked=S.debts.filter(function(x){return x.txId===rec.id}),locked=linked.some(function(x){return x.pays.length});
  if(locked){var old=S.tx.filter(function(x){return x.id===rec.id})[0];rec.owed=old?old.owed:0}
  else{
    if(d.id)removeLinkedDebts(rec.id);
    var sc=splitCalc(d);
    if(sc){
      rec.owed=sc.owed;
      var names=d.split.names,acc=0;
      names.forEach(function(n,i){
        var a=i===names.length-1?r2(sc.owed-acc):sc.each;acc+=a;
        S.debts.push({id:uid(),who:n,dir:'to',cur:d.cur,amt:a,date:d.date,note:rec.note||'Общий расход',txId:rec.id,pays:[]});
      });
    }
  }
  if(d.id)S.tx=S.tx.map(function(t){return t.id===d.id?rec:t});else S.tx.push(rec);
  S.last={pot:d.pot};
  save();closeSheet();toast(d.id?'Сохранено':(d.t==='e'?(rec.owed?'Расход добавлен, долг сохранён':'Расход добавлен'):d.t==='i'?'Доход добавлен':'Переведено'));
}
function removeDebt(id){
  var db=S.debts.filter(function(x){return x.id===id})[0];if(!db)return;
  db.pays.forEach(function(p){S.tx=S.tx.filter(function(t){return t.id!==p.txId})});
  if(db.txId){
    var t=S.tx.filter(function(x){return x.id===db.txId})[0];
    if(t){if(t.dflag)S.tx=S.tx.filter(function(x){return x.id!==t.id});else t.owed=Math.max(0,r2((t.owed||0)-db.amt))}
  }
  S.debts=S.debts.filter(function(x){return x.id!==id});
}
function act(a,el){
  if(ui.sheet)sync();
  var v=el.dataset.v,id=el.dataset.id,d=ui.draft;
  switch(a){
    case 'tab':ui.tab=v;ui.confirm='';render();window.scrollTo(0,0);break;
    case 'per':ui.per=v;render();break;
    case 'prev':shift(-1);render();break;
    case 'next':shift(1);render();break;
    case 'now':ui.anchor=new Date();ui.anchor.setHours(12);render();break;
    case 'disp':S.disp=v;save();render();break;
    case 'fpot':ui.fPot=id;render();break;
    case 'fcat':ui.fCat=id;render();break;
    case 'statcat':ui.fCat=id;ui.fPot='';ui.q='';ui.tab='history';render();window.scrollTo(0,0);break;
    case 'add':
      if(!S.pots.length){toast('Сначала создай счёт');openSheet('pot',{name:'',cur:S.disp});break}
      openSheet('tx',newDraft('e'));break;
    case 'edit':
      var t=S.tx.filter(function(x){return x.id===id})[0];
      if(t){
        var linked=S.debts.filter(function(x){return x.txId===t.id}),dr=newDraft(t.t,t.pot);
        dr.id=t.id;dr.amt=String(t.amt);dr.cur=t.cur;dr.cat=t.cat||'';dr.to=t.to||'';dr.date=t.date;dr.note=t.note;dr.ts=t.ts;dr.touchedCur=true;dr.pot=t.pot;
        if(linked.length){dr.split={on:true,mode:(t.owed>=t.amt-0.005?'all':'eq'),names:linked.map(function(x){return x.who})};dr.splitLocked=linked.some(function(x){return x.pays.length})}
        openSheet('tx',dr);
      }break;
    case 'close':closeSheet();break;
    case 'dtype':d.t=v;d.cat='';d.to='';if(v!=='e')d.split.on=false;renderSheet();break;
    case 'key':
      if(v==='⌫')d.amt=d.amt.slice(0,-1);
      else if(v==='.'){if(d.amt.indexOf('.')<0)d.amt=(d.amt||'0')+'.'}
      else{var dot=d.amt.indexOf('.');if(d.amt.length<10&&(dot<0||d.amt.length-dot<=2))d.amt=(d.amt==='0'?'':d.amt)+v}
      renderSheet();break;
    case 'dcur':d.cur=CURS[(CURS.indexOf(d.cur)+1)%CURS.length];d.touchedCur=true;renderSheet();break;
    case 'rcur':case 'dcur2':d.cur=v;renderSheet();break;
    case 'dpot':d.pot=id;if(d.to===id)d.to='';if(!d.touchedCur&&!d.id&&ui.sheet==='tx'){var q=pot(id);if(q)d.cur=q.cur}renderSheet();break;
    case 'dto':d.to=id;renderSheet();break;
    case 'dcat':d.cat=id;renderSheet();break;
    case 'setd':d[el.dataset.f]=v;renderSheet();break;
    case 'splitt':d.split.on=!d.split.on;renderSheet();break;
    case 'smode':d.split.mode=v;renderSheet();break;
    case 'snt':
      var nm=el.dataset.n,i=d.split.names.map(function(x){return x.toLowerCase()}).indexOf(nm.toLowerCase());
      if(i>=0)d.split.names.splice(i,1);else d.split.names.push(nm);
      renderSheet();break;
    case 'snadd':
      var nn=(d.sname||'').trim();
      if(nn&&d.split.names.map(function(x){return x.toLowerCase()}).indexOf(nn.toLowerCase())<0){var known=people().filter(function(x){return x.toLowerCase()===nn.toLowerCase()})[0];d.split.names.push(known||nn)}
      d.sname='';renderSheet();break;
    case 'save':saveTx();break;
    case 'del':
      if(ui.confirm==='del'){removeLinkedDebts(d.id);S.tx=S.tx.filter(function(x){return x.id!==d.id});save();closeSheet();toast('Удалено')}
      else{ui.confirm='del';renderSheet()}break;
    case 'potnew':openSheet('pot',{name:'',cur:S.disp});break;
    case 'potedit':var p=pot(id);if(p)openSheet('pot',{id:p.id,name:p.name,cur:p.cur});break;
    case 'potcur':d.cur=v;renderSheet();break;
    case 'potsave':
      var pn=(d.name||'').trim();if(!pn){toast('Введи название');break}
      if(d.id){S.pots.forEach(function(p){if(p.id===d.id){p.name=pn;p.cur=d.cur}})}
      else{var np={id:uid(),name:pn,cur:d.cur};S.pots.push(np);S.last={pot:np.id}}
      save();closeSheet();break;
    case 'potdel':
      if(ui.confirm==='potdel'){
        S.tx.filter(function(t){return t.pot===d.id||t.to===d.id}).forEach(function(t){removeLinkedDebts(t.id)});
        S.tx=S.tx.filter(function(t){return t.pot!==d.id&&t.to!==d.id});S.pots=S.pots.filter(function(p){return p.id!==d.id});save();closeSheet();toast('Счёт удалён')}
      else{ui.confirm='potdel';renderSheet()}break;
    case 'topup':openSheet('tx',newDraft('i',id));break;
    case 'xfer':openSheet('tx',newDraft('tr',id));break;
    case 'wipe':openSheet('wipe',{stage:1});break;
    case 'wipego':
      d.stage=2;renderSheet();
      var left=10;
      ui.tm=setInterval(function(){
        left--;
        if(left<=0){clearInterval(ui.tm);ui.tm=null;doWipe()}
        else{var e=document.getElementById('cd');if(e)e.textContent=left}
      },1000);break;
    case 'bknow':snapshot('manual');render();toast('Копия сохранена на этом устройстве');break;
    case 'bkrestore':
      var key='bk'+id;
      if(ui.confirm===key){
        var b=bkList().filter(function(x){return String(x.ts)===id})[0];
        if(b){try{var o=JSON.parse(b.data);snapshot('before restore');S=o;fix();save();ui.confirm='';render();toast('Восстановлена копия от '+fdt(b.ts))}catch(e){toast('Эта копия повреждена')}}
      }else{ui.confirm=key;render()}
      break;
    case 'catadd':
      var cn=document.getElementById('newcat').value.trim(),ty=document.getElementById('newcattype').value;
      if(!cn)break;
      var used=S.cats.filter(function(c){return c.type===ty}).length;
      S.cats.push({id:uid(),name:cn,type:ty,color:COLORS[used%COLORS.length]});save();render();break;
    case 'catdel':
      if(ui.confirm==='catdel'+id){S.cats=S.cats.filter(function(c){return c.id!==id});delete S.limits[id];ui.confirm='';save()}
      else ui.confirm='catdel'+id;
      render();break;
    /* recurring */
    case 'recnew':
      var rp=pot(S.last&&S.last.pot)||S.pots[0];
      openSheet('rec',{t:'e',name:'',amt:'',cur:rp?rp.cur:S.disp,cat:'',pot:rp?rp.id:'',freq:'monthly',next:ymd(new Date()),on:true});break;
    case 'recedit':
      var r=S.rec.filter(function(x){return x.id===id})[0];
      if(r)openSheet('rec',{id:r.id,t:r.t,name:r.name,amt:String(r.amt),cur:r.cur,cat:r.cat,pot:r.pot,freq:r.freq,next:r.next,on:r.on!==false});break;
    case 'rfreq':d.freq=v;renderSheet();break;
    case 'rectoggle':d.on=d.on===false;renderSheet();break;
    case 'recsave':
      var rn=(d.name||'').trim(),ra=num(d.amt);
      if(!rn||!(ra>0)||!d.cat||!d.pot||!d.next)break;
      var rec={id:d.id||uid(),name:rn,t:d.t,amt:ra,cur:d.cur,cat:d.cat,pot:d.pot,freq:d.freq,dom:pd(d.next).getDate(),next:d.next,on:d.on!==false};
      if(d.id)S.rec=S.rec.map(function(x){return x.id===d.id?rec:x});else S.rec.push(rec);
      var added=processRec();save();closeSheet();toast(added?'Добавлено платежей до сегодняшнего дня: '+added:'Регулярный платёж сохранён');break;
    case 'recdel':
      if(ui.confirm==='recdel'){S.rec=S.rec.filter(function(x){return x.id!==d.id});save();closeSheet()}
      else{ui.confirm='recdel';renderSheet()}break;
    /* debts */
    case 'debtnew':openSheet('debt',{dir:'to',who:'',amt:'',cur:S.disp,note:'',pot:'',date:ymd(new Date())});break;
    case 'ddir':d.dir=v;renderSheet();break;
    case 'dwho':d.who=el.dataset.n;renderSheet();break;
    case 'rpot':d.pot=id;renderSheet();break;
    case 'debtsave':
      var who=(d.who||'').trim(),da=num(d.amt);
      if(!who||!(da>0))break;
      var known2=people().filter(function(x){return x.toLowerCase()===who.toLowerCase()})[0];
      var nd={id:uid(),who:known2||who,dir:d.dir,cur:d.cur,amt:da,date:d.date,note:(d.note||'').trim(),txId:null,pays:[]};
      if(d.pot){
        var tx={id:uid(),t:d.dir==='to'?'e':'i',amt:da,cur:d.cur,cat:'',pot:d.pot,to:null,date:d.date,note:'Долг: '+nd.who,ts:Date.now(),dflag:true};
        S.tx.push(tx);nd.txId=tx.id;
      }
      S.debts.push(nd);save();closeSheet();toast('Долг сохранён');break;
    case 'settle':
      var db=S.debts.filter(function(x){return x.id===id})[0];
      if(db){var lp=S.last&&S.last.pot;openSheet('repay',{debtId:id,amt:String(rem(db)),pot:(lp&&pot(lp)&&pot(lp).cur===db.cur)?lp:'',date:ymd(new Date())})}break;
    case 'repaysave':
      var dbt=S.debts.filter(function(x){return x.id===d.debtId})[0];if(!dbt)break;
      var pa=Math.min(num(d.amt),rem(dbt));
      if(!(pa>0)){toast('Введи сумму');break}
      var ptx=null;
      if(d.pot){ptx={id:uid(),t:dbt.dir==='to'?'i':'e',amt:pa,cur:dbt.cur,cat:'',pot:d.pot,to:null,date:d.date,note:'Долг: '+dbt.who,ts:Date.now(),dflag:true};S.tx.push(ptx)}
      dbt.pays.push({id:uid(),amt:pa,date:d.date,txId:ptx?ptx.id:null});
      save();closeSheet();toast(rem(dbt)<=0.004?'Долг погашен':'Выплата записана');break;
    case 'debtdel':
      if(ui.confirm==='debtdel'){removeDebt(d.debtId);save();closeSheet();toast('Долг удалён')}
      else{ui.confirm='debtdel';renderSheet()}break;
    /* misc */
    case 'pull':pullRates(true);break;
    case 'copy':copyBackup();break;
    case 'restore':restoreBackup();break;
  }
}
function copyBackup(){
  var txt=JSON.stringify(S);
  function fallback(){ui.restore=txt;render();var ta=document.getElementById('rest');if(ta){ta.focus();ta.select()}toast('Выдели текст и скопируй его')}
  function done(){S.lastExport=Date.now();save();render();toast('Копия скопирована. Вставь её в «Заметки».')}
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
}
function restoreBackup(){
  var ta=document.getElementById('rest');
  try{var o=JSON.parse(ta.value);if(!o||!o.pots||!o.tx||!o.cats||!o.rates)throw 0;snapshot('before restore');S=o;fix();ui.restore='';save();render();toast('Копия восстановлена')}
  catch(e){toast('Это не похоже на резервную копию')}
}
function pullRates(manual){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort()},6000);
  fetch('https://open.er-api.com/v6/latest/USD',ctl?{signal:ctl.signal}:{}).then(function(r){return r.json()}).then(function(j){
    clearTimeout(to);
    if(j&&j.rates&&j.rates.AED&&j.rates.KGS){S.rates.AED=j.rates.AED;S.rates.KGS=j.rates.KGS;S.ratesAt=Date.now();save();render();if(manual)toast('Курсы обновлены')}
    else throw 0;
  }).catch(function(){clearTimeout(to);if(manual)toast('Нет связи с сервисом курсов. Измени курсы вручную.')});
}

document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(el&&!el.disabled)act(el.dataset.a,el)});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dt'&&ui.draft){if(t.value){ui.draft.date=t.value;renderSheet()}}
  else if(t.id==='r-AED'||t.id==='r-KGS'){
    var v=num(t.value);
    if(v>0){S.rates[t.id.slice(2)]=v;S.ratesAt=Date.now();save();toast('Курс сохранён')}else{toast('Введи число больше нуля')}
    render();
  }else if(t.dataset&&t.dataset.cn){
    var nm=t.value.trim();S.cats.forEach(function(c){if(c.id===t.dataset.cn&&nm)c.name=nm});save();render();
  }else if(t.dataset&&t.dataset.lim){
    var id=t.dataset.lim,a=num(t.value),sel=document.querySelector('[data-limcur="'+id+'"]');
    if(a>0)S.limits[id]={amt:a,cur:sel?sel.value:S.disp};else delete S.limits[id];
    save();render();
  }else if(t.dataset&&t.dataset.limcur){
    var id2=t.dataset.limcur;if(S.limits[id2]){S.limits[id2].cur=t.value;save()}
  }else if(t.id==='rest'){ui.restore=t.value}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){ui.q=e.target.value;var l=document.getElementById('hlist');if(l)l.innerHTML=histList()}
});
/* no pinch zoom */
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&!ui.sheet){autoSnap();var n=processRec();if(n){render();toast('Добавлено регулярных платежей: '+n)}}
});

var firstN=processRec();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
if(firstN)toast('Добавлено регулярных платежей: '+firstN);
if(navigator.onLine&&(Date.now()-(S.ratesAt||0))>864e5)pullRates(false);
})();
</script>

</body>
